<div class="signup-div container">
    <div class="signup-div-header row">
        <div class="sm-col-8 md-col-8 lg-col-8">
            <h2 class="signup-text">Sign up</h2>
        </div>
        <div class="sm-col-2 md-col-2 lg-col-2">
            
        </div>
    </div>
    <div class="signup-div-data row">
        <input id="email" type="text" placeholder="Email: " >
        <br><br>
        <input id="firstname" type="text" placeholder="First name: ">
        <br><br>
        <input id="lastname" type="text" placeholder="Last name: ">
        <br><br>
        <input id="username" type="text" placeholder="Username: ">
        <br><br>
        <input id="password" type="password" placeholder="Password: ">
        <br><br>
        <input id="password_confirm" type="password" placeholder="Password: ">
    </div>
</div>
