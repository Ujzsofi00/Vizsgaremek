<div class="container-fluid" id="mainContainer">
  <div class="row h-100 w-100">
    <div class="col-lg-12 d-flex justify-content-center align-items-center">
      <div class="container-fluid d-flex flex-column justify-content-between my-5" id="secondContainer">

        <div class="row mt-5">
          <div class="col-lg-12 d-flex justify-content-center">
            <div id="titleContainer" class="d-flex justify-content-center align-items-center">
              <span class="text-center m-0 text-white">Regisztráció</span>
            </div>
          </div>
        </div>

        <div class="row my-5">
          <div class="col-lg-12">
            <form [formGroup]="registerForm" class="container-fluid d-flex flex-column justify-content-center py-4"> 
              <div class="row">
                <div class="col-lg-12">
                  <label for="email">E-mail:</label> <br>
                  <input formControlName="email" id="email" class="w-100" type="text" placeholder="Írja ide az e-mail címét!">
                </div>
              </div>

               <div class="row mt-3">
                <div class="col-lg-12">
                  <label for="username">Felhasználónév:</label> <br>
                  <input formControlName="username" id="username" class="w-100" type="text" placeholder="Írja ide a felhasználónevét!">
                </div>
              </div>

               <div class="row mt-3">
                <div class="col-lg-12">
                  <label for="firstName">Vezetéknév:</label> <br>
                  <input formControlName="firstName" id="firstName" class="w-100" type="text" placeholder="Írja ide a vezetéknevét!">
                </div>
              </div>

               <div class="row mt-3">
                <div class="col-lg-12">
                  <label for="lastName">Keresztnév:</label> <br>
                  <input formControlName="lastName" id="lastName" class="w-100" type="text" placeholder="Írja ide a keresztnevét!">
                </div>
              </div>

              <div class="row mt-3">
                <div class="co-lg-l2">
                  <label for="password">Jelszó</label>
                  <input formControlName="password" id="password" class="w-100" type="password" placeholder="Írja ide a jelszavát!">
                </div>
              </div>

              <div class="row mt-3">
                <div class="co-lg-l2">
                  <label for="passwordAgain">Jelszó újra</label>
                  <input formControlName="passwordAgain" id="passwordAgain" class="w-100" type="password" placeholder="Írja ide újból a jelszavát!">
                </div>
              </div>
            </form>  
          </div>
        </div>

        <div class="row mb-5">
          <div class="col-lg-12 d-flex flex-column align-items-center">
            <p class="text-center m-0 mb-2">Már van fiókja? <a class="fw-bold text-decoration-none" routerLink="/login">Jelentkezzen be!</a></p>
              <button [disabled]="registerForm.invalid" id="loginButton">Regisztráció</button>  
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
