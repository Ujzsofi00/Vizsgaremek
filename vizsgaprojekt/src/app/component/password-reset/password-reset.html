<div class="container-fluid" id="mainContainer" style="margin-bottom: 150px">
  <div class="row h-100 w-100">
    <div class="col-lg-12 d-flex justify-content-center align-items-center">
      <div class="container-fluid d-flex flex-column justify-content-between" id="secondContainer">
        <div class="row mt-5">
          <div class="col-lg-12 d-flex justify-content-center">
            <div id="titleContainer" class="d-flex justify-content-center align-items-center">
              <span class="text-center m-0 text-white">Jelszó visszaállítás!</span>
            </div>
          </div>
        </div>

        <div class="row my-5">
          <div class="col-lg-12">
            <form
              [formGroup]="form"
              class="container-fluid d-flex flex-column justify-content-center py-4"
            >
              <div class="row">
                <div class="col-lg-8">
                  <label for="email" class="text-lg-start text-center w-100">Email cím</label>
                  <br />
                  <input
                    formControlName="email"
                    id="email"
                    class="w-100 px-2"
                    type="text"
                    placeholder="Írja ide az email címét!"
                  />
                </div>
                <div class="col-lg-4 d-flex align-items-end justify-content-center">
                  <button id="senderButton" (click)="getCode()">Küldés</button>
                </div>
              </div>

              <div class="row mt-3">
                <div class="co-lg-l2">
                  <label for="verificationCode" class="text-lg-start text-center w-100"
                    >Hitelesitő kód</label
                  >
                  <input
                    formControlName="verificationCode"
                    id="verificationCode"
                    class="w-100 px-2"
                    type="text"
                    placeholder="Írja ide a hitelesitő kódot!"
                    #vCodeInput
                    (input)="checkVCode(vCodeInput.value)"
                  />
                </div>
              </div>

              @if (showPasswordInputs) {
                <div class="row mt-3">
                  <div class="co-lg-l2">
                    <label for="newPassword" class="text-lg-start text-center w-100"
                      >Új jelszó</label
                    >
                    <input
                      formControlName="newPassword"
                      id="newPassword"
                      class="w-100 px-2"
                      type="password"
                      placeholder="Írja ide a hitelesitő kódot!"
                    />
                  </div>
                </div>

                <div class="row mt-3">
                  <div class="co-lg-l2">
                    <label for="newPasswordAgain" class="text-lg-start text-center w-100"
                      >Új jelszó megerősítése</label
                    >
                    <input
                      formControlName="newPasswordAgain"
                      id="newPasswordAgain"
                      class="w-100 px-2"
                      type="password"
                      placeholder="Írja ide a hitelesitő kódot!"
                    />
                  </div>
                </div>
              }
            </form>
          </div>
        </div>

        <div class="row mb-5">
          <div class="col-lg-12 d-flex flex-column align-items-center">
            <p class="text-center m-0 mb-2">
              Még nincs fiókja?
              <a class="fw-bold text-decoration-none" routerLink="/register">Regisztráljon</a>
            </p>
            <button [disabled]="form.invalid" id="loginButton" (click)="sendReset()">Átállitás</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
