<div class="container-fluid" id="mainContainer">
  <div class="row h-100 w-100">
    <div class="col-lg-12 d-flex justify-content-center align-items-center">
      <div class="container-fluid d-flex flex-column justify-content-between" id="secondContainer">

        <div class="row mt-5">
          <div class="col-lg-12 d-flex justify-content-center">
            <div id="titleContainer" class="d-flex justify-content-center align-items-center">
              <span class="text-center m-0 text-white">Bejelentkezés</span>
            </div>
          </div>
        </div>

        <div class="row my-5">
          <div class="col-lg-12">
            <form [formGroup]="loginForm" class="container-fluid d-flex flex-column justify-content-center ">
              <div class="row">
                <div class="col-lg-12">
                  <label for="username">Felhasználónév</label> <br>
                  <input formControlName="username" id="username" class="w-100" type="text" placeholder="Írja ide a felhasználónevét!">
                </div>
              </div>

              <div class="row mt-3">
                <div class="co-lg-l2">
                  <label for="password">Jelszó</label>
                  <input formControlName="password" id="password" class="w-100" type="password" placeholder="Írja ide a jelszavát!">
                </div>
              </div>
            </form>
          </div>
        </div>

        <div class="row mb-5">
          <div class="col-lg-12 d-flex flex-column align-items-center">
            <p class="text-center m-0 mb-2">Még nincs fiókja? <a class="fw-bold text-decoration-none" routerLink="/register">Regisztráljon</a></p>
            <button [disabled]="loginForm.invalid" id="loginButton">Bejelentkezés</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
