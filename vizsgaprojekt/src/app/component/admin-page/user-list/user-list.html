<div class="container-fluid">
  <div class="row">
    <div class="col-lg-12">
      <h1 class="text-center mt-4">Felhasználók kezelése</h1>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-12">
      @for (user of users(); track $index) {
        <div class="container-fluid userCard my-5">
          <div class="row h-100 py-lg-0 py-3">
            <div class="col-lg-8 d-flex flex-column justify-content-center">
              <h4 class="text-lg-start text-center">{{user.firstName}} {{user.lastName}} adatai:</h4>
              <ul class="m-0 list-unstyled px-3">
                <li class="text-lg-start text-center"><span class="fw-bold">Felhasználónév:</span> {{user.username}}</li>
                <li class="text-lg-start text-center"><span class="fw-bold">E-mail cím:</span> {{user.email}}</li>
              </ul>

              <div class="d-flex justify-content-lg-start justify-content-center">
                <mat-checkbox [checked]="user.role?.name == 'ROLE_worker'" (change)="changeRoleOfUser(user, $index)">Dolgozó</mat-checkbox>
              </div>
            </div>

            <div class="col-lg-4 d-flex justify-content-center align-items-center">
              <button class="deleteButton" (click)="deleteUser(user)">Törlés</button>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</div>
