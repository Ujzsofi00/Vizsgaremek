<div class="container-fluid">
  <div class="row">
    <div class="col-lg-12">
      <h1 class="text-center mt-4">Felhasználók kezelése</h1>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-12">
      @for (user of users(); track $index) {
        <div class="container-fluid userCard my-4">
          <div class="row h-100">
            <div class="col-lg-8 d-flex flex-column justify-content-center">
              <h4>{{user.firstName}} {{user.lastName}} adatai:</h4>
              <ul class="m-0 list-unstyled px-3">
                <li><span class="fw-bold">Felhasználónév:</span> {{user.username}}</li>
                <li><span class="fw-bold">E-mail cím:</span> {{user.email}}</li>
              </ul>

              <mat-checkbox [checked]="user.role?.name == 'ROLE_worker'" (change)="changeRoleOfUser(user, $index)">Dolgozó</mat-checkbox>
            </div>

            <div class="col-lg-4 d-flex justify-content-center align-items-center">
              <button class="deleteButton" (click)="deleteUser(user)">Törlés</button>
            </div>
          </div>
        </div>
      }
    </div>
  </div>

  <div class="row">
    <div class="col-lg-12">
      <mat-paginator [length]="100" [pageSize]="5" >
      </mat-paginator>
    </div>
  </div>
</div>
