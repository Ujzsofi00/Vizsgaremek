<div class="container-fluid" style="height: 86vh;">
  <div class="row h-100">
    <div class="col-lg-4 h-100 d-flex justify-content-center align-items-center">
      <div class="container-fluid d-flex flex-column justify-content-between contentContainer" id="profilContainer">

        <div class="row">
          <div class="col-lg-12">
            <img src="" alt="">
          </div>
        </div>

        <div class="row">
          <div class="col-lg-12">
            <ul>
              <li>Teljes név:</li>
              <li>E-mail cím:</li>
              <li>Felhasználónév:</li>
            </ul>
          </div>
        </div>

        <div class="row">
          <div class="col-lg-12 d-flex flex-column justify-content-center align-items-center">
            <button class="dangerButton mb-3">Profil törlése</button>
          </div>
        </div>

      </div>
    </div>
    <div class="col-lg-8 h-100 d-flex justify-content-center align-items-center">
      <div class="container-fluid contentContainer" id="appointmentContainer">
        @if(appointments.length > 0){<div class="row">
          <div class="col-lg-12">
            <h1 class="text-center my-2">Lefoglalt időpontjaim:</h1>
          </div>
        </div>}

        <div class="row h-100">
          <div class="col-lg-12 h-100">
            @for (appointment of appointments; track $index) {
              <app-appointment-card [appointment]="appointment" (startCanelling)="selectedAppointmentId = $event" />
            } @empty {
              <div class="d-flex flex-column justify-content-center align-items-center h-100">
                <h1 class="text-center">Még nem foglaltál időpontot</h1>
                <button>Időpont foglalása</button>
              </div>
            }
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

@if (selectedAppointmentId != null || showConfirmation) {

}
